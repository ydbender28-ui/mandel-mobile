<!DOCTYPE html>
<html>
<head>
  <base href="/mandel-mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mandel Tobacco wholesale ordering app">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mandel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme -->
  <meta name="theme-color" content="#0d1117">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mandel Wholesale</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "533583736";
  </script>
  <script src="flutter.js" defer></script>

  <!-- ZXing barcode decoder (jsDelivr CDN is more reliable than unpkg) -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script>
    // Resize a data-URL image to maxW wide on a canvas and return new data URL.
    // Large iPhone photos (4032×3024) cause ZXing to OOM/hang — shrink first.
    function _resizeDataUrl(dataUrl, maxW, done) {
      var img = new Image();
      img.onload = function() {
        var scale = img.naturalWidth > maxW ? maxW / img.naturalWidth : 1;
        var w = Math.round(img.naturalWidth * scale);
        var h = Math.round(img.naturalHeight * scale);
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        done(c.toDataURL('image/jpeg', 0.92));
      };
      img.onerror = function() { done(dataUrl); }; // fall back to original
      img.src = dataUrl;
    }

    function _zxingDecode(dataUrl, cb) {
      try {
        if (typeof ZXing === 'undefined' || !ZXing.BrowserMultiFormatReader) { cb(null); return; }
        new ZXing.BrowserMultiFormatReader()
          .decodeFromImageUrl(dataUrl)
          .then(function(r) { cb(r.getText()); })
          .catch(function() { cb(null); });
      } catch(e) { cb(null); }
    }

    window.scanBarcodeFromPhoto = function(callback) {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      input.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;';

      var done = false;
      function finish(val) {
        if (done) return;
        done = true;
        if (input.parentNode) input.parentNode.removeChild(input);
        callback(val);
      }

      input.addEventListener('change', function() {
        var file = input.files && input.files[0];
        if (!file) { finish(null); return; }

        var fr = new FileReader();
        fr.onload = function(evt) {
          var originalUrl = evt.target.result;

          // Resize to 1280px wide — large phone photos silently OOM ZXing
          _resizeDataUrl(originalUrl, 1280, function(smallUrl) {

            // 1) Try native BarcodeDetector (Chrome / Android)
            if (window.BarcodeDetector) {
              var img = new Image();
              img.onload = function() {
                new BarcodeDetector().detect(img)
                  .then(function(codes) {
                    if (codes.length > 0) finish(codes[0].rawValue);
                    else _zxingDecode(smallUrl, finish);
                  })
                  .catch(function() { _zxingDecode(smallUrl, finish); });
              };
              img.onerror = function() { _zxingDecode(smallUrl, finish); };
              img.src = smallUrl;
            } else {
              // 2) ZXing on resized image
              _zxingDecode(smallUrl, finish);
            }
          });
        };
        fr.onerror = function() { finish(null); };
        fr.readAsDataURL(file);
      });

      input.addEventListener('cancel', function() { finish(null); });
      document.body.appendChild(input);
      input.click();
    };
  </script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
