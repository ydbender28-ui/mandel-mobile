<!DOCTYPE html>
<html>
<head>
  <base href="/mandel-mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mandel Tobacco wholesale ordering app">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mandel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme -->
  <meta name="theme-color" content="#0d1117">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mandel Wholesale</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "2377298298";
  </script>
  <script src="flutter.js" defer></script>

  <!-- ZXing barcode decoder for photo-based scanning on web/Safari -->
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script>
    window.scanBarcodeFromPhoto = function(callback) {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      input.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;';

      var done = false;
      function finish(val) {
        if (done) return;
        done = true;
        if (input.parentNode) input.parentNode.removeChild(input);
        callback(val);
      }

      // ZXing fallback — use a data URL (not a blob URL) so iOS Safari doesn't block it
      function tryZXing(dataUrl) {
        try {
          if (typeof ZXing === 'undefined' || !ZXing.BrowserMultiFormatReader) {
            finish(null); return;
          }
          new ZXing.BrowserMultiFormatReader()
            .decodeFromImageUrl(dataUrl)
            .then(function(r) { finish(r.getText()); })
            .catch(function() { finish(null); });
        } catch(e) { finish(null); }
      }

      input.addEventListener('change', function() {
        var file = input.files && input.files[0];
        if (!file) { finish(null); return; }

        // Always read as data URL first — blob URLs break on iOS Safari
        var fr = new FileReader();
        fr.onload = function(evt) {
          var dataUrl = evt.target.result;

          // Use native BarcodeDetector if available (Chrome / Android WebView)
          if (window.BarcodeDetector) {
            var img = new Image();
            img.onload = function() {
              new BarcodeDetector().detect(img)
                .then(function(codes) {
                  if (codes.length > 0) finish(codes[0].rawValue);
                  else tryZXing(dataUrl);
                })
                .catch(function() { tryZXing(dataUrl); });
            };
            img.onerror = function() { tryZXing(dataUrl); };
            img.src = dataUrl;
          } else {
            tryZXing(dataUrl);
          }
        };
        fr.onerror = function() { finish(null); };
        fr.readAsDataURL(file);
      });

      input.addEventListener('cancel', function() { finish(null); });
      document.body.appendChild(input);
      input.click();
    };
  </script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
