<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mandel Tobacco wholesale ordering app">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mandel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme -->
  <meta name="theme-color" content="#0d1117">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mandel Wholesale</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>

  <!-- ZXing barcode decoder for photo-based scanning on web/Safari -->
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script>
    // Opens native iOS/Android camera via file picker, then decodes the barcode photo.
    // Uses a callback because Dart's dart:js can't await JS Promises directly.
    window.scanBarcodeFromPhoto = function(callback) {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      input.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';

      input.addEventListener('change', function() {
        var file = input.files && input.files[0];
        if (!file) { callback(null); cleanup(); return; }

        var url = URL.createObjectURL(file);
        var reader = new ZXing.BrowserMultiFormatReader();
        reader.decodeFromImageUrl(url)
          .then(function(result) {
            URL.revokeObjectURL(url);
            callback(result.getText());
          })
          .catch(function() {
            URL.revokeObjectURL(url);
            callback(null);
          })
          .finally(cleanup);
      });

      // If user cancels without selecting, clean up after a short delay
      input.addEventListener('cancel', function() {
        callback(null);
        cleanup();
      });

      function cleanup() {
        if (input.parentNode) input.parentNode.removeChild(input);
      }

      document.body.appendChild(input);
      input.click();
    };
  </script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
